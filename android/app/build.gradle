plugins { id 'com.android.application' }

def signingFile = rootProject.file('keystore.properties')
def signingValues = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signingValues.load(it) }

android {
    namespace 'com.pocketledger.local'
    compileSdk 35
    defaultConfig {
        applicationId 'com.pocketledger.local'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        if (signingFile.exists()) {
            personal {
                storeFile rootProject.file(signingValues['storeFile'])
                storePassword signingValues['storePassword']
                keyAlias signingValues['keyAlias']
                keyPassword signingValues['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signingFile.exists()) signingConfig signingConfigs.personal
        }
    }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
